<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title> Task Manager Dashboard </title>
    <link rel = "stylesheet" href="style.css">
</head>

<body>
    <div class="dashboard">
<header> <h1> Task Manager</h1>
    <p> Hello user </p>
</header>

 <!-- Statistics -->
        <section class="stats">

            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="card">
                <h3>Remaining</h3>
                <p id="remainingTasks">0</p>
            </div>

        </section>

    <!-- Task Creator -->
        <section class="task-box">

            <input 
            type="text" 
            id="taskInput" 
            placeholder="Add a new task">

            <button id="addTask">
                Add Task
            </button>

        </section>

         <!-- Tasks -->
        <section>

            <h2>Your Tasks</h2>

            <ul id="taskList"></ul>

        </section>

    <div class="container">
        <input type = "text" id = "taskInput" placeholder="Enter a task">
        <button id="addTask"> Add Task</button>
    </div>
    <ul id="taskList"></ul>
    <button id="fetchTasksButton"> Fetch API Tasks</button>

    <script src ="script.js"></script>
</div>    
</body>
</html>
