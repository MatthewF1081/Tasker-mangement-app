<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Task Manager Dashboard </title>
    <link rel = "stylesheet" href="styles.css">
    <script src = "management_Java.js" defer></script>
</head>
<header>
    <h1>Task Manager</h1>
    <p id="greeting">Hello, <span id="userName">User</span></p>
</header>

<!-- Login Modal -->
<div id="loginModal" class="modal hidden">
    <div class="modal-content">
        <h2>Sign in</h2>
        <p class="modal-sub">Enter a name to personalize your dashboard.</p>
        <input type="text" id="nameInput" placeholder="Your name">
        <div class="modal-actions">
            <button id="cancelLogin" class="secondary">Cancel</button>
            <button id="confirmLogin">Continue</button>
        </div>
    </div>
</div>

<body>
    <div class="dashboard">
 <!-- Statistics -->
        <section class="stats">

            <div class="card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="card">
                <h3>Remaining</h3>
                <p id="remainingTasks">0</p>
            </div>

        </section>

    <!-- Task Creator -->
        <section class="task-box">

            <input 
            type="text" 
            id="taskInput" 
            placeholder="Add a new task">

            <button id="addTask">
                Add Task
            </button>

        </section>

         <!-- Tasks -->
        <section>

            <h2>Your Tasks</h2>

            <ul id="taskList"></ul>

        </section>
         <!-- API Section -->

        <section class="api-card">

            <h2>Daily Motivation</h2>

            <p id="quote">
                Loading quote...
            </p>

        </section>


        <section class="api-card">

            <h2>Weather</h2>

            <p id="weather">
                Loading weather...
            </p>

        </section>
    </head>
    </body>
  </html>
